<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        .icon-container {
            background-color: #222;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 40px;
        }
        .icon {
            width: 40px;
            height: 40px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
            margin-bottom: 40px;
        }
        .button {
            display: block;
            background-color: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            width: 100%;
            margin-bottom: 40px;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .button:hover {
            background-color: #e0e0e0;
        }
        .resend-text {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
        }
        .resend-link {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            margin-left: 5px;
        }
        .resend-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </div>
        <h1>Verify your email</h1>
        <p>We've sent a verification link to your email address. Click the button below to verify your account.</p>
        <a href="#" class="button">Verify Email</a>
        <div class="resend-text">
            Didn't receive an email? <a href="#" class="resend-link">Resend verification</a>
        </div>
    </div>
</body>
</html>
